<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="theme-color" content="#0d3b6e"/>
<title>MediTrack is offline</title>
<!-- Shown by the service worker when the home Mac can't be reached. Everything is inline: no other files. No patient data. -->
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#424242;margin:0;padding:2rem 1.25rem;display:flex;justify-content:center}
.box{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.12);padding:1.5rem;max-width:440px;width:100%}
h1{font-size:1.3rem;color:#616161;margin:0 0 .5rem}
p{font-size:1rem;line-height:1.5;margin:.5rem 0}
ul{padding-left:1.2rem;line-height:1.8;font-size:1rem}
button{width:100%;font-size:17px;padding:.9rem;border:none;border-radius:10px;background:#1565c0;color:#fff;font-weight:600;margin-top:1rem}
.small{font-size:.85rem;color:#757575}
</style>
</head>
<body>
<div class="box">
  <h1>MediTrack is offline</h1>
  <p>The home Mac is off, asleep or restarting. Notifications will resume when it's back.</p>
  <p><strong>Check:</strong></p>
  <ul>
    <li>Is the Mac on and logged in?</li>
    <li>Is Tailscale on, on this phone?</li>
  </ul>
  <button onclick="location.reload()">Try again</button>
  <p class="small">Nothing you entered was lost. It's all saved on the Mac.</p>
</div>
</body>
</html>
