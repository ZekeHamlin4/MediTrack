<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MediTrack - Medical Supply Tracker</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue-dark:#0d3b6e;--blue:#1565c0;--blue-light:#1e88e5;--blue-pale:#e3f2fd;--teal:#00897b;--red:#c62828;--red-light:#ffebee;--orange:#e65100;--orange-light:#fff3e0;--green:#2e7d32;--green-light:#e8f5e9;--gray-100:#f5f5f5;--gray-200:#eeeeee;--gray-300:#e0e0e0;--gray-500:#9e9e9e;--gray-700:#616161;--gray-900:#212121;--white:#ffffff;--shadow-sm:0 1px 3px rgba(0,0,0,.12);--shadow-md:0 4px 12px rgba(0,0,0,.15);--radius:8px;--radius-lg:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray-100);color:var(--gray-900);min-height:100vh}
.app-header{background:linear-gradient(135deg,var(--blue-dark) 0%,var(--blue) 100%);color:white;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow-md)}
.app-header h1{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.header-subtitle{font-size:.75rem;opacity:.8}
.tab-bar{background:var(--white);display:flex;border-bottom:2px solid var(--gray-200);overflow-x:auto;scrollbar-width:none;position:sticky;top:60px;z-index:99;box-shadow:var(--shadow-sm)}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{flex:1;min-width:90px;padding:.75rem .5rem;border:none;background:none;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--gray-700);border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:.2rem}
.tab-btn:hover{background:var(--blue-pale);color:var(--blue)}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);background:var(--blue-pale)}
.main-content{padding:1.5rem;max-width:1200px;margin:0 auto}
.card{background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:1rem;font-weight:700;color:var(--blue-dark);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem;border-bottom:1px solid var(--gray-200);padding-bottom:.75rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:var(--white);border-radius:var(--radius-lg);padding:1.25rem;box-shadow:var(--shadow-sm);border-left:4px solid var(--blue);display:flex;flex-direction:column;gap:.25rem}
.stat-card.warning{border-left-color:var(--orange)}.stat-card.danger{border-left-color:var(--red)}.stat-card.success{border-left-color:var(--green)}
.stat-value{font-size:2rem;font-weight:800;color:var(--blue-dark);line-height:1}
.stat-card.warning .stat-value{color:var(--orange)}.stat-card.danger .stat-value{color:var(--red)}.stat-card.success .stat-value{color:var(--green)}
.stat-label{font-size:.8rem;color:var(--gray-700);font-weight:500}.stat-icon{font-size:1.5rem;margin-bottom:.25rem}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
thead th{background:var(--blue-dark);color:white;padding:.75rem 1rem;text-align:left;font-weight:600;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--gray-200)}tbody tr:hover{background:var(--blue-pale)}
tbody td{padding:.65rem 1rem;vertical-align:middle}
.row-low-stock{background:var(--red-light)!important}.row-warning{background:var(--orange-light)!important}
.badge{display:inline-block;padding:.2rem .6rem;border-radius:999px;font-size:.72rem;font-weight:700}
.badge-blue{background:var(--blue-pale);color:var(--blue)}.badge-red{background:var(--red-light);color:var(--red)}
.badge-orange{background:var(--orange-light);color:var(--orange)}.badge-green{background:var(--green-light);color:var(--green)}
.badge-gray{background:var(--gray-200);color:var(--gray-700)}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem 1rem;border:none;border-radius:var(--radius);cursor:pointer;font-size:.85rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--blue);color:white}.btn-primary:hover{background:var(--blue-dark)}
.btn-success{background:var(--green);color:white}.btn-success:hover{background:#1b5e20}
.btn-danger{background:var(--red);color:white}.btn-danger:hover{background:#7f0000}
.btn-secondary{background:var(--gray-200);color:var(--gray-900)}.btn-secondary:hover{background:var(--gray-300)}
.btn-sm{padding:.3rem .65rem;font-size:.78rem}.btn:disabled{opacity:.5;cursor:not-allowed}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem}
.form-group{display:flex;flex-direction:column;gap:.3rem}
label{font-size:.8rem;font-weight:600;color:var(--gray-700)}
input,select,textarea{padding:.55rem .8rem;border:1.5px solid var(--gray-300);border-radius:var(--radius);font-size:.88rem;background:var(--white);color:var(--gray-900);transition:border-color .2s;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.filter-bar{display:flex;flex-wrap:wrap;gap:.75rem;margin-bottom:1rem;align-items:center}
.qty-editor{display:flex;align-items:center;gap:.35rem}.qty-editor input{width:60px;text-align:center;padding:.3rem}
.scanner-wrap{position:relative;background:#000;border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1rem}
#quagga-viewport{width:100%;min-height:220px}
#quagga-viewport video,#quagga-viewport canvas{width:100%!important;height:auto!important;display:block}
.scanner-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70%;height:40%;border:3px solid var(--blue-light);border-radius:8px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.4)}
.scan-result{border:2px solid var(--blue);border-radius:var(--radius-lg);padding:1.25rem;background:var(--blue-pale);margin-top:1rem}
.portal-header{background:linear-gradient(135deg,var(--teal) 0%,#00695c 100%);color:white;padding:1.5rem;border-radius:var(--radius-lg);margin-bottom:1.5rem;text-align:center}
.activity-item{display:flex;align-items:flex-start;gap:.75rem;padding:.75rem 0;border-bottom:1px solid var(--gray-200)}
.activity-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.activity-icon.add{background:var(--green-light)}.activity-icon.remove{background:var(--red-light)}.activity-icon.check{background:var(--blue-pale)}
.activity-text{flex:1}.activity-text strong{display:block;font-size:.9rem}.activity-text span{font-size:.78rem;color:var(--gray-700)}
.activity-time{font-size:.75rem;color:var(--gray-500);white-space:nowrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--white);border-radius:var(--radius-lg);padding:1.5rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
.modal-footer{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--gray-200)}
.user-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem}
.user-card{background:var(--white);border-radius:var(--radius-lg);padding:1rem;box-shadow:var(--shadow-sm);border-top:3px solid var(--blue);display:flex;flex-direction:column;gap:.5rem}
.role-family{border-top-color:var(--teal)}.role-nurse{border-top-color:var(--blue)}.role-doctor{border-top-color:var(--green)}.role-admin{border-top-color:var(--red)}
.loading{display:flex;align-items:center;justify-content:center;padding:3rem;color:var(--gray-500);font-size:.9rem;gap:.75rem}
.spinner{width:24px;height:24px;border:3px solid var(--gray-300);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:.85rem 1rem;border-radius:var(--radius);margin-bottom:1rem;font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:.5rem}
.alert-success{background:var(--green-light);color:var(--green);border:1px solid #a5d6a7}
.alert-error{background:var(--red-light);color:var(--red);border:1px solid #ef9a9a}
.alert-warning{background:var(--orange-light);color:var(--orange);border:1px solid #ffcc80}
.cat-breakdown{display:flex;flex-wrap:wrap;gap:.75rem}
.cat-chip{background:var(--gray-100);border:1px solid var(--gray-300);border-radius:var(--radius);padding:.5rem .9rem;font-size:.82rem;display:flex;flex-direction:column;gap:.1rem}
.section-title{font-size:1.2rem;font-weight:800;color:var(--blue-dark);margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--gray-500)}
.empty-state .empty-icon{font-size:3rem;margin-bottom:.75rem}
@media(max-width:640px){.main-content{padding:.75rem}.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;
const api={
  get:(p)=>fetch(p).then(r=>r.json()),
  post:(p,b)=>fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
  put:(p,b)=>fetch(p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()),
  del:(p)=>fetch(p,{method:'DELETE'}).then(r=>r.json()),
};
function timeAgo(d){if(!d)return'';const m=Math.floor((Date.now()-new Date(d))/60000);if(m<1)return'just now';if(m<60)return m+'m ago';const h=Math.floor(m/60);if(h<24)return h+'h ago';return Math.floor(h/24)+'d ago';}
function stockBadge(q,t){if(q===0)return React.createElement('span',{className:'badge badge-red'},'Out of Stock');if(q<=t)return React.createElement('span',{className:'badge badge-orange'},'Low Stock');return React.createElement('span',{className:'badge badge-green'},'In Stock');}
function catColor(c){return({'Trach & Airway':'#1565c0','Ventilator':'#6a1b9a','G-Tube & Feeding':'#00695c','Wheelchair & Mobility':'#e65100','Medications':'#c62828','Wound Care':'#2e7d32','General Nursing':'#0277bd'})[c]||'#616161';}
const CATS=['Trach & Airway','Ventilator','G-Tube & Feeding','Wheelchair & Mobility','Medications','Wound Care','General Nursing'];
function Alert({type,msg,onClose}){useEffect(()=>{if(!msg)return;const t=setTimeout(onClose,4000);return()=>clearTimeout(t);},[msg]);if(!msg)return null;return(<div className={'alert alert-'+type} style={{position:'fixed',bottom:'1rem',right:'1rem',zIndex:300,maxWidth:'360px',boxShadow:'0 4px 12px rgba(0,0,0,.2)'}}>{msg}<button onClick={onClose} style={{marginLeft:'auto',background:'none',border:'none',cursor:'pointer'}}>x</button></div>);}
function ActivityItem({item}){const icons={add:'+ ',remove:'- ',check:'v '};return(<div className="activity-item"><div className={'activity-icon '+(item.action||'check')}>{icons[item.action]||'?'}</div><div className="activity-text"><strong>{item.supply_name||'Unknown'}</strong><span>{item.action==='add'?'Added '+item.quantity:item.action==='remove'?'Removed '+item.quantity:'Checked'}{item.user_name?' by '+item.user_name:''}</span></div><div className="activity-time">{timeAgo(item.scanned_at)}</div></div>);}
function Dashboard(){const[data,setData]=useState(null);useEffect(()=>{api.get('/api/dashboard').then(setData);},[]);if(!data)return<div className="loading"><div className="spinner"/>Loading...</div>;return(<div><div className="section-title">Dashboard</div><div className="stats-grid"><div className="stat-card"><div className="stat-icon">&#128230;</div><div className="stat-value">{data.totalSupplies}</div><div className="stat-label">Supply Types</div></div><div className="stat-card success"><div className="stat-icon">&#128450;</div><div className="stat-value">{data.totalItems}</div><div className="stat-label">Total Items</div></div><div className={'stat-card '+(data.lowStockCount>3?'danger':data.lowStockCount>0?'warning':'success')}><div className="stat-icon">&#9888;</div><div className="stat-value">{data.lowStockCount}</div><div className="stat-label">Low Stock</div></div></div>{data.lowStockItems.length>0&&(<div className="card" style={{borderLeft:'4px solid var(--red)'}}><div className="card-title">Low Stock Alerts</div><div className="table-wrap"><table><thead><tr><th>Supply</th><th>Category</th><th>Qty</th><th>Status</th></tr></thead><tbody>{data.lowStockItems.map(s=>(<tr key={s.id} className={s.quantity===0?'row-low-stock':'row-warning'}><td><strong>{s.name}</strong></td><td>{s.category}</td><td style={{fontWeight:700,color:s.quantity===0?'var(--red)':'var(--orange)'}}>{s.quantity} {s.unit}</td><td>{stockBadge(s.quantity,s.low_stock_threshold)}</td></tr>))}</tbody></table></div></div>)}<div className="card"><div className="card-title">By Category</div><div className="cat-breakdown">{data.categoryBreakdown.map(c=>(<div key={c.category} className="cat-chip" style={{borderTop:'3px solid '+catColor(c.category)}}><span style={{fontWeight:700}}>{c.category}</span><span style={{color:'var(--gray-700)'}}>{c.count} types / {c.total_qty} items</span></div>))}</div></div><div className="card"><div className="card-title">Recent Activity</div>{data.recentScans.length===0?<div className="empty-state"><div className="empty-icon">&#128203;</div><p>No activity yet.</p></div>:data.recentScans.map(s=><ActivityItem key={s.id} item={s}/>)}</div></div>);}
function SuppliesTab({showAlert}){const[supplies,setSupplies]=useState([]);const[loading,setLoading]=useState(true);const[search,setSearch]=useState('');const[cat,setCat]=useState('');const[lowOnly,setLowOnly]=useState(false);const[showModal,setShowModal]=useState(false);const[editItem,setEditItem]=useState(null);const[editQty,setEditQty]=useState({});const load=useCallback(()=>{const p=new URLSearchParams();if(search)p.set('search',search);if(cat)p.set('category',cat);if(lowOnly)p.set('low_stock','1');api.get('/api/supplies?'+p).then(d=>{setSupplies(d);setLoading(false);});},[search,cat,lowOnly]);useEffect(()=>{setLoading(true);load();},[load]);const del=async(id,name)=>{if(!confirm('Delete "'+name+'"?'))return;await api.del('/api/supplies/'+id);showAlert('success',name+' deleted');load();};const saveQty=async(s)=>{const q=parseInt(editQty[s.id]);if(isNaN(q)||q<0)return;await api.put('/api/supplies/'+s.id,{quantity:q});showAlert('success','Qty updated');setEditQty(p=>{const n={...p};delete n[s.id];return n;});load();};return(<div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'.5rem'}}><div className="section-title" style={{marginBottom:0}}>Supplies Inventory</div><button className="btn btn-primary" onClick={()=>{setEditItem(null);setShowModal(true);}}>+ Add Supply</button></div><div className="filter-bar"><input type="search" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:'180px'}}/><select value={cat} onChange={e=>setCat(e.target.value)}><option value="">All Categories</option>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select><label style={{display:'flex',alignItems:'center',gap:'.4rem',fontSize:'.85rem',fontWeight:600}}><input type="checkbox" checked={lowOnly} onChange={e=>setLowOnly(e.target.checked)}/>Low Stock Only</label></div>{loading?<div className="loading"><div className="spinner"/>Loading...</div>:supplies.length===0?<div className="empty-state"><p>No supplies found.</p></div>:(<div className="card" style={{padding:0}}><div className="table-wrap"><table><thead><tr><th>Name</th><th>Category</th><th>Qty</th><th>Status</th><th>Barcode</th><th>Actions</th></tr></thead><tbody>{supplies.map(s=>{const isLow=s.quantity<=s.low_stock_threshold;const isOut=s.quantity===0;return(<tr key={s.id} className={isOut?'row-low-stock':isLow?'row-warning':''}><td><div style={{fontWeight:600}}>{s.name}</div></td><td><span className="badge" style={{background:catColor(s.category)+'22',color:catColor(s.category)}}>{s.category}</span></td><td><div className="qty-editor"><input type="number" min="0" value={editQty[s.id]!==undefined?editQty[s.id]:s.quantity} onChange={e=>setEditQty(p=>({...p,[s.id]:e.target.value}))} onBlur={()=>editQty[s.id]!==undefined&&saveQty(s)} onKeyDown={e=>e.key==='Enter'&&saveQty(s)} style={{width:'64px'}}/><span style={{fontSize:'.78rem',color:'var(--gray-700)'}}>{s.unit}</span></div></td><td>{stockBadge(s.quantity,s.low_stock_threshold)}</td><td style={{fontSize:'.78rem',fontFamily:'monospace'}}>{s.barcode||'-'}</td><td><div style={{display:'flex',gap:'.4rem'}}><button className="btn btn-sm btn-secondary" onClick={()=>{setEditItem(s);setShowModal(true);}}>Edit</button><button className="btn btn-sm btn-danger" onClick={()=>del(s.id,s.name)}>Del</button></div></td></tr>);})}</tbody></table></div></div>)}{showModal&&<SupplyModal item={editItem} onClose={()=>setShowModal(false)} onSaved={()=>{setShowModal(false);load();}} showAlert={showAlert}/>}</div>);}
function SupplyModal({item,onClose,onSaved,showAlert}){const[form,setForm]=useState({name:item?.name||'',category:item?.category||CATS[0],description:item?.description||'',quantity:item?.quantity??0,unit:item?.unit||'each',barcode:item?.barcode||'',qr_code:item?.qr_code||'',low_stock_threshold:item?.low_stock_threshold??5});const[saving,setSaving]=useState(false);const set=(k,v)=>setForm(p=>({...p,[k]:v}));const submit=async(e)=>{e.preventDefault();setSaving(true);try{if(item){await api.put('/api/supplies/'+item.id,form);showAlert('success',form.name+' updated');}else{await api.post('/api/supplies',form);showAlert('success',form.name+' added');}onSaved();}catch{showAlert('error','Failed to save');}finally{setSaving(false);}};return(<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}><div className="modal"><div className="modal-header"><h2>{item?'Edit Supply':'Add Supply'}</h2><button className="btn btn-secondary btn-sm" onClick={onClose}>x</button></div><form onSubmit={submit}><div className="form-grid"><div className="form-group" style={{gridColumn:'1/-1'}}><label>Name *</label><input required value={form.name} onChange={e=>set('name',e.target.value)}/></div><div className="form-group"><label>Category</label><select value={form.category} onChange={e=>set('category',e.target.value)}>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div><div className="form-group"><label>Unit</label><input value={form.unit} onChange={e=>set('unit',e.target.value)}/></div><div className="form-group"><label>Quantity</label><input type="number" min="0" value={form.quantity} onChange={e=>set('quantity',parseInt(e.target.value)||0)}/></div><div className="form-group"><label>Low Stock Alert At</label><input type="number" min="0" value={form.low_stock_threshold} onChange={e=>set('low_stock_threshold',parseInt(e.target.value)||0)}/></div><div className="form-group"><label>Barcode</label><input value={form.barcode} onChange={e=>set('barcode',e.target.value)}/></div><div className="form-group" style={{gridColumn:'1/-1'}}><label>Description</label><textarea rows={2} value={form.description} onChange={e=>set('description',e.target.value)}/></div></div><div className="modal-footer"><button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Saving...':item?'Save Changes':'Add Supply'}</button></div></form></div></div>);}
function ScanTab({showAlert}){const[scanning,setScanning]=useState(false);const[code,setCode]=useState('');const[result,setResult]=useState(null);const[action,setAction]=useState('remove');const[qty,setQty]=useState(1);const[notes,setNotes]=useState('');const[users,setUsers]=useState([]);const[uid,setUid]=useState('');const active=useRef(false);useEffect(()=>{api.get('/api/users').then(setUsers);return()=>stop();},[]);const stop=()=>{if(active.current){try{Quagga.stop();}catch(e){}active.current=false;setScanning(false);}};const startScan=()=>{if(active.current){stop();return;}setResult(null);Quagga.init({inputStream:{name:'Live',type:'LiveStream',target:document.getElementById('qvp'),constraints:{facingMode:'environment',width:640,height:360}},decoder:{readers:['code_128_reader','ean_reader','ean_8_reader','code_39_reader','upc_reader']},locate:true},(err)=>{if(err){showAlert('error','Camera unavailable. Use manual entry.');return;}Quagga.start();active.current=true;setScanning(true);});Quagga.onDetected((d)=>{const c=d.codeResult.code;stop();lookup(c);});};const lookup=async(c)=>{if(!c||!c.trim())return;const r=await api.get('/api/supplies/barcode/'+encodeURIComponent(c.trim()));if(r.error){showAlert('warning','Not found: '+c);setResult(null);}else setResult(r);};const log=async()=>{if(!result)return;const r=await api.post('/api/supplies/scan',{supply_id:result.id,user_id:uid||null,action,quantity:qty,notes});setResult(r.supply);showAlert('success','Logged '+action);setNotes('');};return(<div><div className="section-title">Scan &amp; Log</div><div className="card"><div className="card-title">Camera Scanner</div><button className={'btn '+(scanning?'btn-danger':'btn-primary')} onClick={startScan} style={{marginBottom:'1rem'}}>{scanning?'Stop Camera':'Start Camera'}</button>{scanning&&<div className="scanner-wrap"><div id="qvp"/><div className="scanner-overlay"/></div>}<p style={{color:'var(--gray-700)',fontSize:'.82rem'}}>Points camera at barcode. Auto-detects Code 128, EAN, UPC formats.</p></div><div className="card"><div className="card-title">Manual Entry</div><form onSubmit={e=>{e.preventDefault();lookup(code);}} style={{display:'flex',gap:'.75rem',flexWrap:'wrap'}}><input value={code} onChange={e=>setCode(e.target.value)} placeholder="Enter barcode..." style={{flex:1,minWidth:'200px'}}/><button type="submit" className="btn btn-primary">Look Up</button><button type="button" className="btn btn-secondary" onClick={()=>{setResult(null);setCode('');}}>Clear</button></form></div>{result&&(<div className="scan-result"><h3>{result.name}</h3><div style={{display:'flex',gap:'.75rem',flexWrap:'wrap',marginBottom:'1rem',fontSize:'.88rem'}}><span><strong>Category:</strong> {result.category}</span><span><strong>Qty:</strong> <strong style={{color:result.quantity<=result.low_stock_threshold?'var(--red)':'var(--green)'}}>{result.quantity} {result.unit}</strong></span></div><div className="form-grid"><div className="form-group"><label>Action</label><select value={action} onChange={e=>setAction(e.target.value)}><option value="remove">Remove (use)</option><option value="add">Add (restock)</option><option value="check">Check (count)</option></select></div><div className="form-group"><label>Quantity</label><input type="number" min="1" value={qty} onChange={e=>setQty(parseInt(e.target.value)||1)}/></div><div className="form-group"><label>Logged by</label><select value={uid} onChange={e=>setUid(e.target.value)}><option value="">Anonymous</option>{users.map(u=><option key={u.id} value={u.id}>{u.name}</option>)}</select></div><div className="form-group" style={{gridColumn:'1/-1'}}><label>Notes</label><input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="e.g. used during trach change"/></div></div><div style={{marginTop:'.75rem',display:'flex',gap:'.75rem'}}><button className="btn btn-success" onClick={log}>Log {action}</button><button className="btn btn-secondary" onClick={()=>{setResult(null);setCode('');}}>Clear</button></div></div>)}</div>);}
function PortalTab(){const[supplies,setSupplies]=useState([]);const[loading,setLoading]=useState(true);const[cat,setCat]=useState('');useEffect(()=>{const p=new URLSearchParams();if(cat)p.set('category',cat);api.get('/api/supplies?'+p).then(d=>{setSupplies(d);setLoading(false);});},[cat]);const low=supplies.filter(s=>s.quantity<=s.low_stock_threshold);return(<div><div className="portal-header"><h2>Family &amp; Staff Portal</h2><p>Read-only supply view for caregivers and family</p><div style={{marginTop:'.75rem',fontSize:'.8rem',opacity:.8}}>{window.location.origin}?view=portal</div></div>{low.length>0&&<div className="alert alert-warning">Warning: {low.length} item(s) low on stock: {low.slice(0,3).map(s=>s.name).join(', ')}</div>}<div className="filter-bar"><select value={cat} onChange={e=>setCat(e.target.value)}><option value="">All Categories</option>{CATS.map(c=><option key={c} value={c}>{c}</option>)}</select></div>{loading?<div className="loading"><div className="spinner"/>Loading...</div>:(<div className="card" style={{padding:0}}><div className="table-wrap"><table><thead><tr><th>Supply</th><th>Category</th><th>Qty</th><th>Unit</th><th>Status</th></tr></thead><tbody>{supplies.map(s=>{const isLow=s.quantity<=s.low_stock_threshold;const isOut=s.quantity===0;return(<tr key={s.id} className={isOut?'row-low-stock':isLow?'row-warning':''}><td style={{fontWeight:600}}>{s.name}</td><td><span className="badge" style={{background:catColor(s.category)+'22',color:catColor(s.category)}}>{s.category}</span></td><td style={{fontWeight:700,color:isOut?'var(--red)':isLow?'var(--orange)':'var(--green)'}}>{s.quantity}</td><td>{s.unit}</td><td>{stockBadge(s.quantity,s.low_stock_threshold)}</td></tr>);})}</tbody></table></div></div>)}</div>);}
function ActivityLogTab(){const[log,setLog]=useState([]);const[loading,setLoading]=useState(true);useEffect(()=>{api.get('/api/scan-log?limit=200').then(d=>{setLog(d);setLoading(false);});},[]);return(<div><div className="section-title">Activity Log</div><div className="card">{loading?<div className="loading"><div className="spinner"/>Loading...</div>:log.length===0?<div className="empty-state"><p>No activity yet.</p></div>:log.map(i=><ActivityItem key={i.id} item={i}/>)}</div></div>);}
function UsersTab({showAlert}){const[users,setUsers]=useState([]);const[loading,setLoading]=useState(true);const[showModal,setModal]=useState(false);const load=()=>api.get('/api/users').then(d=>{setUsers(d);setLoading(false);});useEffect(()=>{load();},[]);const del=async(id,name)=>{if(!confirm('Remove "'+name+'"?'))return;await api.del('/api/users/'+id);showAlert('success',name+' removed');load();};return(<div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}><div className="section-title" style={{marginBottom:0}}>Users &amp; Access</div><button className="btn btn-primary" onClick={()=>setModal(true)}>+ Add User</button></div>{loading?<div className="loading"><div className="spinner"/>Loading...</div>:<div className="user-list">{users.map(u=>(<div key={u.id} className={'user-card role-'+u.role}><div style={{fontWeight:700}}>{u.name}</div><span className="badge badge-blue">{u.role}</span>{u.email&&<div style={{fontSize:'.8rem',color:'var(--gray-700)'}}>{u.email}</div>}<button className="btn btn-sm btn-danger" style={{marginTop:'.5rem'}} onClick={()=>del(u.id,u.name)}>Remove</button></div>))}</div>}{showModal&&<AddUserModal onClose={()=>setModal(false)} onSaved={()=>{setModal(false);load();}} showAlert={showAlert}/>}</div>);}
function AddUserModal({onClose,onSaved,showAlert}){const[form,setForm]=useState({name:'',email:'',role:'nurse',pin_hash:''});const[saving,setSaving]=useState(false);const set=(k,v)=>setForm(p=>({...p,[k]:v}));const submit=async(e)=>{e.preventDefault();setSaving(true);try{await api.post('/api/users',form);showAlert('success',form.name+' added');onSaved();}catch{showAlert('error','Failed');}finally{setSaving(false);}};return(<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}><div className="modal"><div className="modal-header"><h2>Add User</h2><button className="btn btn-secondary btn-sm" onClick={onClose}>x</button></div><form onSubmit={submit}><div className="form-grid"><div className="form-group" style={{gridColumn:'1/-1'}}><label>Name *</label><input required value={form.name} onChange={e=>set('name',e.target.value)}/></div><div className="form-group"><label>Email</label><input type="email" value={form.email} onChange={e=>set('email',e.target.value)}/></div><div className="form-group"><label>Role</label><select value={form.role} onChange={e=>set('role',e.target.value)}><option value="family">Family</option><option value="nurse">Nurse</option><option value="doctor">Doctor</option><option value="admin">Admin</option></select></div></div><div className="modal-footer"><button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button><button type="submit" className="btn btn-primary" disabled={saving}>{saving?'Saving...':'Add User'}</button></div></form></div></div>);}
const TABS=[{id:'dashboard',label:'Dashboard',icon:'D'},{id:'supplies',label:'Supplies',icon:'S'},{id:'scan',label:'Scan',icon:'C'},{id:'portal',label:'Portal',icon:'P'},{id:'activity',label:'Activity',icon:'A'},{id:'users',label:'Users',icon:'U'}];
function App(){const p=new URLSearchParams(window.location.search);const[tab,setTab]=useState(p.get('view')==='portal'?'portal':'dashboard');const[alert,setAlert]=useState({type:'success',msg:''});const showAlert=(type,msg)=>setAlert({type,msg});const clearAlert=()=>setAlert(a=>({...a,msg:''}));const content=()=>{switch(tab){case'dashboard':return<Dashboard/>;case'supplies':return<SuppliesTab showAlert={showAlert}/>;case'scan':return<ScanTab showAlert={showAlert}/>;case'portal':return<PortalTab/>;case'activity':return<ActivityLogTab/>;case'users':return<UsersTab showAlert={showAlert}/>;default:return<Dashboard/>;}};return(<><header className="app-header"><h1>MediTrack<div className="header-subtitle">Medical Supply Tracker</div></h1><div style={{fontSize:'.78rem',opacity:.8,textAlign:'right'}}><div>Pediatric Care</div><div>Trach / Vent / G-Tube</div></div></header><nav className="tab-bar">{TABS.map(t=><button key={t.id} className={'tab-btn'+(tab===t.id?' active':'')} onClick={()=>setTab(t.id)}>{t.label}</button>)}</nav><main className="main-content">{content()}</main><Alert type={alert.type} msg={alert.msg} onClose={clearAlert}/></>);}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
